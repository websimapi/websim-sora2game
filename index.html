<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Animation Labeler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Video Quadrant Labeler</h1>
        <p>Upload a video, adjust the quadrant sizes by dragging the lines, and label each animation.</p>
        
        <div class="upload-container">
            <input type="file" id="video-upload" accept="video/*" hidden>
            <label for="video-upload" class="upload-button">Choose Video</label>
        </div>

        <div id="cropper-container" style="display: none;">
            <div class="video-wrapper">
                <video id="source-video" muted loop playsinline></video>
                <div id="cropper-overlay">
                    <!-- Crop boxes will be dynamically generated here -->
                </div>
            </div>
        </div>
        
        <div id="quadrants-container">
            <!-- Video quadrants will be dynamically added here -->
        </div>

        <button id="save-labels-btn" style="display: none;">Save Labels</button>

        <div id="output-container" style="display: none;">
            <h2>Generated Labels (JSON)</h2>
            <pre id="json-output"></pre>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
