<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Animation Labeler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Video Quadrant Labeler</h1>
        <p>Upload a video, adjust the quadrant sizes by dragging the lines, and label each animation.</p>
        
        <div class="upload-container">
            <input type="file" id="video-upload" accept="video/*" hidden>
            <label for="video-upload" class="upload-button">Choose Video</label>
        </div>

        <div id="chroma-key-controls" style="display: none;">
            <h3>Chroma Key (Background Removal)</h3>
            <div>
                <input type="checkbox" id="chroma-key-toggle">
                <label for="chroma-key-toggle">Enable Background Removal</label>
            </div>
            <div class="color-control-group" id="color-control-1">
                <label for="chroma-key-color-1">Background Color 1:</label>
                <input type="color" id="chroma-key-color-1" value="#00ff00">
                <button class="eyedropper-btn" data-color-index="1">Pick Color</button>
            </div>
            <div class="color-control-group" id="color-control-2" style="display: none;">
                <label for="chroma-key-color-2">Background Color 2:</label>
                <input type="color" id="chroma-key-color-2" value="#0000ff">
                <button class="eyedropper-btn" data-color-index="2">Pick Color</button>
                <button id="remove-color-2-btn">Remove</button>
            </div>
            <button id="add-color-btn">Add second color</button>

            <div>
                <label for="chroma-key-threshold-main">Similarity Threshold:</label>
                <input type="range" id="chroma-key-threshold-main" min="0" max="200" value="40">
                <span id="threshold-value-main">40</span>
            </div>
        </div>

        <div id="cropper-container" style="display: none;">
            <div class="video-wrapper">
                <video id="source-video" muted loop playsinline></video>
                <div id="cropper-overlay">
                    <div id="vertical-line" class="drag-line"></div>
                    <div id="horizontal-line" class="drag-line"></div>
                </div>
            </div>
        </div>
        
        <div id="quadrants-container">
            <!-- Video quadrants will be dynamically added here -->
        </div>

        <button id="save-labels-btn" style="display: none;">Save Labels</button>

        <div id="output-container" style="display: none;">
            <h2>Generated Labels (JSON)</h2>
            <pre id="json-output"></pre>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
